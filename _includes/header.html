<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ site.description }}">
    <meta name="theme-color" content="#052049">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()"/>

    <!-- Social preview card, used when a page is shared -->
    <meta property="og:site_name" content="{{ site.name }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: site.name }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/static/img/logo/og-card.jpg' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.name }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ '/static/img/logo/og-card.jpg' | absolute_url }}">

    <meta name="author" content="Fraser Lab, University of California, San Francisco">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ResearchOrganization",
      "name": "Fraser Lab",
      "url": "{{ site.url }}",
      "description": "{{ site.description }}",
      "parentOrganization": {
        "@type": "CollegeOrUniversity",
        "name": "University of California, San Francisco",
        "url": "https://www.ucsf.edu"
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "600 16th Street, Genentech Hall Room S472E",
        "addressLocality": "San Francisco",
        "addressRegion": "CA",
        "postalCode": "94158",
        "addressCountry": "US"
      },
      "employee": {
        "@type": "Person",
        "name": "James S. Fraser",
        "jobTitle": "Professor and Chair, Department of Bioengineering and Therapeutic Sciences",
        "identifier": "https://orcid.org/0000-0002-5080-2859",
        "affiliation": {
          "@type": "CollegeOrUniversity",
          "name": "University of California, San Francisco"
        }
      }
    }
    </script>

    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    {% if page.group == 'news' %}
    <link rel="alternate" type="application/atom+xml" title="Fraser Lab News Feed" href="/news.xml">
    {% endif %}

    <link href="/static/css/syntax.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
  </head>

  <body>

    <a class="skip-link" href="#main">Skip to main content</a>

    <!-- Static navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #052049">
        <a class="navbar-brand" href="/">{{site.name}}</a>
        <a href="https://www.ucsf.edu" rel="noopener"><img class="inline-block navb-icon" src="/static/img/logo/ucsf_logo_white.svg" alt="University of California, San Francisco (UCSF) logo"></a>
        <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="navbar-collapse collapse" id="navbarContent">
          <ul class="navbar-nav ml-auto">
            {% for link in site.data.navigation %}
              {% if page.group == link.group %}
                <li class="nav-item active"><a class="nav-link" href="{{link.link}}"> {{link.name}}<span class="sr-only">(current)</span></a></li>
              {% else %}
                <li class="nav-item"><a class="nav-link" href="{{link.link}}"> {{link.name}}</a></li>
              {% endif %}
            {% endfor %}
          </ul>
        </div><!--/.nav-collapse -->
      </nav>

    <main id="main" class="container">
