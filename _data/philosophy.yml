- title: Outside Resources
  id: "resources"
  show: False
  body: |
    A comprehensive collection of some resources for the topics listed in this compact has been compiled [here](https://docs.google.com/document/d/1zSiJaa5gQIHJ7G3uSXN5d9BdpvEABmQKi2Yr6j6Lr54/edit?usp=sharing){:target="_blank" rel="noopener"}.
    <br/>
    <br/>
    This development of this compact was guided by similar compacts and philosophies of several labs, see links.

    * [Heemstra Lab, Emory University](https://docs.google.com/document/d/1a8ecjUWVbXR1JqgbzqRwKmqaNK2cvBsysNFVXk56Lpo/edit){:target="_blank" rel="noopener"}
    * [Matreyek Lab, Case Western Reserve University](http://www.matreyeklab.com/6-lab-philosophy/){:target="_blank" rel="noopener"}
    * [Moghe Lab, Cornell University](https://www.moghelab.org/lab-philosophy){:target="_blank" rel="noopener"}
    * [Syed Lab, University of Minnesota](https://docs.google.com/document/d/1wa067HF3iBv5M0_ao6M1GzPg4mUof_PoVlEAKyIn8Xk/edit){:target="_blank" rel="noopener"}

    Earlier versions also drew on the Avasthi Lab and UW-Madison ICTR mentoring resources, which are no longer online.
