- title: Overview
  id: "overview"
  show: True
  body: |
    The [Fraser Lab Mission](#mission) is to do fantastic science, openly! We engage in a lot of collaborative projects and strive for transparency in all things (see also our potential [conflicts of interest](#coi)), but especially in our [publishing](#publishing) practices. We believe great science is made possible by our [lab values](#values), which heavily emphasize [mentorship](#mentorship). Sustaining a positive working environment involves conscientious [communication](#communication) and a shared set of [general lab expectations](#expectations). We take [career development](#career_dev) seriously and make use of all the resources available at UCSF and more broadly. In return, we take tracking and sharing our [data](#data) very seriously. We are very fortunate to have access to an incredible wealth of scientific [literature](#literature), a strong track record of [grant and fellowship funding](#grants), and our amazing colleagues and core facilities at UCSF. Finally, this is a living document informed by a growing collection of external [resources](#resources) — we aim to iteratively improve upon everything described here!

- title: Fraser Lab Mission
  id: "mission"
  show: False
  body: |
    We want to produce high quality research in an uncompromising and transparent manner. We strive to work on unique problems using rigorous methods and disseminate our work as it occurs, through publishing preprints, blog posts, and through not-for-profit publications. Our software and scripts are open access on [GitHub](https://github.com/fraser-lab){:target="_blank" rel="noopener"}. We continuously amend our policies to make our data and methods more accessible to the community.

    Macromolecules are not static, and our scientific mission focuses on the interface between statistical mechanics and biology. We call the branch of structural biology “statistical structural biology” because it breaks the one-to-one mapping of model to dataset, and describes distributions of conformations. Using these approaches, we measure how physical, chemical, and genetic perturbations shift the relative balance of those conformations. Through this mapping of stimuli to sets of structures we gain valuable insight into a variety of biological processes that can be applied to protein engineering or small molecule discovery. See [research](https://fraserlab.com/research/).

- title: Core Lab Values
  id: "values"
  show: False
  body: |
    Our motto is “Beer and Tacos”. While our lab culture is not alcohol focused, it represents our mentality. The phrase was first coined by Dayn Perry regarding baseball scouting. You can find the full origin story in this [2016 blog post](/2016/03/16/BeerAndTacos/){:target="_blank" rel="noopener"}. In short, “Beer and Tacos” is about finding synergy between 2 or more things, especially in cases where they are presented in opposition. For example, we like to publish and [review](/philosophy/peer_review/){:target="_blank" rel="noopener"} preprints AND recognize the value of review-coordination and visibility that traditional outlets provide. Similarly, two groups can ponder over whether to go out for a beer or to go out for tacos, but they don’t have to be mutually exclusive. Why fight? Beer and tacos can be enjoyed together. Cryo-EM or X-ray crystallography for protein structure? Both! “Beer AND Tacos”. We find ways to make things work so we get the best of multiple worlds. Or in the words of Dayn Perry, “Why construct an either-or scenario where none need exist?”

    ![Beer and Tacos Acrostic](/static/img/philosophy/beer_and_tacos_acrostic.png "Beer and Tacos Acrostic!"){: .img-fluid .w-75 p-3 .mx-auto .d-block}

    We’ve used our motto to frame what we value. The lab represents a diverse group of trainees and professionals with respect to race/ethnicity, gender identity, sexuality, nationality, religion, political affiliation, caregiver and family commitments, and beyond. We strive to create a welcoming environment for all people, including underrepresented groups. These values are ideals and we're all growing towards embodying them. We want to call attention to times when we are not living up to them. This document also helps us be accountable to each other as we try to live up to these ideals.

- title: Land Acknowledgment
  id: "land_ack"
  show: False
  body: |
    The Fraser Lab recognizes that [the University of California San Francisco sits on the unceded land of the Ramaytush Ohlone (pronounced Rah-mah-tush O-lone-ee) peoples, the original inhabitants of the San Francisco Peninsula](https://diversity.ucsf.edu/ucsf-land-acknowledgment){:target="_blank" rel="noopener"}. As settlers on this land, we want to recognize the historic, and ongoing, discrimination and violence inflicted upon Indigenous people in North America. Please read our [full statement](/land_ack){:target="_blank" rel="noopener"}.

- title: General Lab Expectations
  id: "expectations"
  show: False
  body: |
    As a researcher you are expected to develop your knowledge and skills, make progress on your projects, and contribute to the running of the lab. This presupposes a lot of self-initiative and personal responsibility. The biggest driver of your academic career is you, not your advisor (JF) or your collaborators. Speak up when you need help or find yourself going down an undesired path as that is when your advisor is most useful. To ensure we can work together effectively, you are also expected to document all of your work, including methods, troubleshooting, and development. This information should be readily available to the rest of the lab, collaborators, and other scientists.

    ### Sharing Your Research

    You are expected to share your research. We highly encourage sharing your work in progress using blog posts on the lab website (or websites of consortia we collaborate with) and by sharing your code as you develop it. Our scholarly work will be published rapidly as preprints and will appear in open-access and non-profit venues. We will work together on writing scholarly outputs, a guide on how to do that effectively is available:

    * [Writing](/philosophy/writing/)
    
    You are also expected to present your research both internally at group meetings a few times a year and at conferences and other national and international meetings periodically. The lab values science communication, and we rely on feedback from group meetings and practice talks to hone our ability to make our science accessible to a variety of communities. This also means you are expected to engage with and give others feedback on their presentations – at group meeting or additional practice talks that are self-organized. You are expected to practice presentations intended for external audiences. Get feedback from multiple lab members and incorporate it. When we present externally, we talk about our work openly and share early. Lab members generally attend 1-2 conferences per year. A guide on how to prepare presentations is available: 

    * [Presentations](/philosophy/presentations/)

    ### Respect

    As a member of the lab community, you are expected to treat fellow members with respect. You are expected to follow lab policies, adapt as they evolve, and be a team player. This includes respect for peoples’ lab areas and personal space and having consent for actions that will affect them. Part of embracing a group of diverse people is that sometimes people’s different opinions and perspectives will lead to conflict. While our opinions or beliefs may differ, we respect each other’s opinions. It is usually better to involve JF as early as possible when potential conflicts between lab members arise. If a satisfactory resolution is not reached after involving JF, we can involve an external moderator, such as the [Ombuds](https://ombuds.ucsf.edu){:target="_blank" rel="noopener"} or a [Restorative Justice circle facilitator](https://studentlife.ucsf.edu/circles){:target="_blank" rel="noopener"}. We’re all growing, trying to live up to our core values, and essential to this is an emphasis on feedback. Even the content presented here is sometimes an idealized version of the lab. For the spring retreat, we have an anonymous lab survey and have a group discussion about how we can improve in the lab.

    Respect also means that when communicating with each other we empower rather than belittle people for their mistakes; we are all learning and growing. We are a collaborative, supportive lab, so we ask for guidance from our fellow lab members. Even within this background of collaboration, self-reliance is important to develop and we try to solve problems on our own first before seeking assistance. Try to find a few possible solutions, try them, and then seek out feedback from lab members and then your advisor. It is expected that you will develop collegial relationships within the lab and occasionally work on shared projects. The spirit between lab members should be of cooperation and not adversarial competition. If someone in the lab has helped you a lot on a project they probably should be included as an author on your publications.

    The diverse nature of work in the lab encourages a lot of collaboration with partner labs both within UCSF, at other universities, and in industry. We seek to collaborate with labs who share a positive environment and a commitment to open science.

    ### Lab Work Policies

    There are no specific "set hours" for the lab, but generally we expect people to be around from 10-4:30. We benefit from a flexible schedule to accommodate caregiver responsibilities, personal fitness, etc. You are expected to attend 1:1, subgroup, and group meetings. The lab is very flexible with rescheduling, just send a message ahead of time and we can likely accommodate it. While group meetings are always in person, a Zoom option can be made available for subgroup or 1:1 on rare occasions. It is ok to occasionally miss group meetings for events like travel, illness (don't come in if you aren't well!), major equipment usage (beamtimes, microscope time), class (although we do our best to schedule around rotation student class schedules), or other rare lab-related events (e.g. time points for uncooperative experiments). If you miss a group meeting, it is expected that you will contact the presenter, get a copy of their slides, and engage them in a conversation about your questions/feedback.

    Our expectations around vacation:

    1. You should take it! Everyone deserves time off to enjoy themselves, friends, family, etc. With some breaks, you will likely be a more productive scientist.
    2. Vacation time is tracked in MyTime for employees. Please keep track of your vacation time. As soon as you know you will be taking time off, please mark it in the respective lab calendar. If you will be taking a vacation for more than a week, please make sure to let me know so I can plan around it!

    If you are in need of support, there are mental health resources provided by UCSF for [students](https://studenthealth.ucsf.edu/){:target="_blank" rel="noopener"} and [staff](https://hr.ucsf.edu/hr.php/x/files?F=1&cms_id=5304){:target="_blank" rel="noopener"}.

- title: Communication
  id: "communication"
  show: False
  body: |
    ### Slack

    Our internal electronic communications occur on Slack, with email reserved for coordinating with external collaborators. It is a given that people can ignore slack messages outside of normal working hours to preserve their personal time and space. For truly urgent/emergency matters, you should contact people by phone/text. Often, deeper conversations are best had synchronously in person, rather than over slack.

    ### Scheduled 1:1 Meetings

    Every six-ish weeks, each lab member has a one-on-one meeting with JF to talk about current progress, issues, etc. To make the most of these meetings, make an agenda and send it in advance of the meeting by Slack.  [There is a post on the lab blog about how to utilize 1:1s by Gabby, a lab alum.](/2021/03/29/one-on-one-meetings/){:target="_blank" rel="noopener"} and these [guidelines](/static/img/philosophy/UW_ICTR_Expectations.pdf){:target="_blank" rel="noopener"} from University of Wisconsin-Madison Institute for Clinical and Translational Research (UW ICTR) on how to make the most out of a mentor/mentee relationship are very helpful.

    A 1:1 meeting might concern long term planning, feedback on a proposal, or the details of an experimental success/failure. The key ingredient is dedicated time that you spend before meeting to think through what would be most useful to you.

    ### Scheduled Subgroup Meetings

    Each lab member meets in a subgroup with 2-5 other lab members every 2-3 weeks. The subgroups are not a perfect division of different topics or types of work in the lab, and this imperfection reflects our interdisciplinary science. The point is that you have a few people who are a bit more informed about your specific project and that have regular feedback from JF every few weeks.

    In the same [blog](/2021/03/29/one-on-one-meetings/){:target="_blank" rel="noopener"} by Gabby about 1:1s, there’s an example of a subgroup meeting presentation.

    People are always expected to have at least something to present, demo, or discuss during a subgroup meeting. While the slides shown are one (great) example of a way to present during a subgroup, it is by no means the only way to successfully utilize a subgroup meeting. The most important preparation is to think ahead of time about what you want to get out of the subgroup. You should consider what feedback you need, where you're stuck, and how you're going to present that in such a way that you can maximize the usefulness of the subgroup meeting.

    ### Impromptu Meetings

    These scheduled meetings represent a LOWER BOUND of communication. A short slack message to JF about an issue will prompt us to find a time to meet about anything that is on your mind! Requesting these one-off meetings to help troubleshoot, navigate a difficult situation, or get unstuck is an important responsibility of every member of the lab. The lab depends a lot on people being proactive - this is a key to training in the lab. These one-off meetings could include just yourself, yourself and other lab members: whoever is needed to get you unstuck. These meetings may range from an early morning writing session/paper babysitting to a 15-minute check-in for quick feedback or advice.

    ### Standup

    Each week, we also have an automated slack-based “standup” report that JF reads every Friday. This lets JF keep tabs on progress and obstacles on a consistent basis, even when traveling. The goal is to provide a high level overview - JF will follow up on Slack or with a one-off meeting depending on need.

- title: Mentorship
  id: "mentorship"
  show: False
  body: |
    Our mentorship philosophy is centered around ensuring lab members are set up to grow towards the position they want next. A major role of the principal investigator is to make sure that the lab provides: the resources to accomplish what they want to accomplish in the lab, an environment conducive to developing new ideas, and tailored support for the next steps in a career (e.g. tapping into the PI's network, prepping chalk talks for faculty positions, etc).

    There are often conflicts of interest between what’s best for the PI, what's best for the lab, and what’s best for the career of a lab member. For example, there is a tension between wanting to keep the talent we've fostered and helping people to move on with their careers. We try to prioritize the career aspirations of lab members. To that end, if we are aligned with people's long-term goals, great science tends also to fall into place.

    It is important to mentor up, defined as [‘the mentee’s proactive engagement in the mentor-mentee relationship, so that both parties mutually benefit from the relationship and move forward towards an agreed-upon purpose or vision’](https://tomprof.stanford.edu/posting/1525){:target="_blank" rel="noopener"}. Beyond this, there are some career-stage-specific guidelines:

    * [Some General Advice for Postdocs](/philosophy/advice_for_postdocs/)
    * [Some General Advice for Graduate Students](/philosophy/advice_for_grad_students/)
    * [Some General Advice for Postbaccs/Technicians](/philosophy/advice_for_postbaccs/)

    ### Career Development {#career_dev}

    Given the rapidly changing career landscape for scientists, JF believes the lab should be a supportive space where each person can develop toward the career that fits them best and the primary goal is to ensure each person grows during their time in the lab in a way that sets them up for the position they want next. It is expected that lab members are engaged in a constant conversation with JF about what they want to do next as this allows for tailored training, networking, conferences, and even aspects of a research project around what will be most beneficial.

    Every summer, each lab member has a 1:1 meeting with JF to review their Individual Development Plan (IDP). The IDP is a regular, structured place to line up your timeline, papers, training goals, and networking opportunities with where you want to go next. To prepare:

    1. Read the [IDP guide](https://docs.google.com/document/d/1qkxtyT8W2DKaeC7sPT0PJcXmvhtDMwvs4g86XzekQVo/edit?usp=sharing){:target="_blank" rel="noopener"} first. It walks through each section of the template with examples.
    2. Make a private copy of the right template in your own Drive, with your name in place of "template":
        * [My First IDP](https://docs.google.com/document/d/1ULzTyvdA5HRwp5csB5Win3_4-f7nbcHIPtN4iceyAeE/edit?usp=sharing){:target="_blank" rel="noopener"} if this is your first IDP in the lab
        * [the annual IDP template](https://docs.google.com/document/d/1UVaRMkQrivqa4_VKBhF1pk93UNomjYE_Y5uQg2VTZhY/edit?usp=sharing){:target="_blank" rel="noopener"} every year after that
    3. Fill it out. Focus your goals on outputs (preprints, fellowships, presentations, job applications) and write them as SMART goals: Specific, Measurable, Attainable, Relevant, Time-based. The template also asks you to assess your communication, leadership and management, and career and professional skills; to reflect on your strengths, what you enjoy, and what you value; and to commit to one small, concrete career development step for the month after the meeting.
    4. Download it as a Word document, upload it through the Dropbox link posted in Slack, and schedule a meeting with JF to discuss it. After the meeting, JF will provide written feedback and suggestions for career development.

    If you are unsure about your career direction, the resources at the end of the IDP guide are good places to start. We also include timelines in group meetings and thesis committee presentations, which lets other lab members know what you are thinking about for experimental planning, publication strategy, and career structure. However, don't wait until the IDP meeting to have this conversation. JF loves it when lab members prompt him for additional meetings to check in about career development, and the cadence and topic of these meetings can change over your time in the lab.

    ### Grant Writing and Fellowship Funding {#grants}

    For all science career paths, being able to explain yourself and the value of your work is an invaluable skill. Funding our research is vital to keeping the lab running. Grant/proposal writing is the responsibility of the entire lab: it is important for developing a key skill, and helps lab members get a feel for how we describe our research in a grant-writing context. Lab members collaborate with the PI to write grants and proposals to fund personnel, to fund lab research and equipment, and to request use of scientific facilities outside of UCSF. There are examples of successful awards on the Fraser Lab internal site.

- title: Publishing
  id: "publishing"
  show: False
  body: |
    The real end goal of any research is to get the work out there for others to build on, not to publish in journals. We encourage sharing of work in progress in a variety of ways, including blog posts on the lab or affiliated consortia websites, presenting data at conferences, and encouraging feedback on our codebases. We post our scholarly work as preprints when we judge them to be ready for feedback. All Fraser Lab scholarly outputs will be published rapidly as preprints (e.g., on bioRxiv, arXiv, ChemRxiv, etc), appear in open access and not-for-profit venues, and be licensed with the Creative Commons Attribution (CC BY 4.0). We also respect all funder publication policies with regard to open-access archives and publication venues. The Fraser Lab no longer publishes in closed access or for-profit venues. 

    Because we center posting preprints as our major scholarly output, that is when we usually undergo a major push to publicize our work, invite feedback from the community, and celebrate the accomplishment of putting scholarly work out into the world. A preprint-centric publishing strategy has important consequences for accelerating science. The traditional "behind closed doors" journal organized peer review process can delay the disclosure of important results by months. Moreover, it is often plagued with politics and biases that are harmful to the scientific process as a whole. The Fraser Lab prefers venues compatible with the “publish, review, curate” model of scientific publishing. This model prioritizes transparent preprint review and allows us, as authors, to remain in control of the extent of the review process. Recognizing the value of a coordinated review process and the audience enabled by open access and not-for-profit venues, some work can also be peer reviewed in a more traditional model.

- title: Reading and Following the Scientific Literature
  id: "literature"
  show: False
  body: |
    As a scientist, it should be a pleasure to keep up with current literature. You should dedicate a few hours each week to scanning and reading new preprints and journal articles - and we recommend a [strategy that leverages RSS feeds](/philosophy/rss_how_to) to follow the literature. Several people in the lab have nerded out on this, so feel free to ask others in the lab how they best like to stay on top of the literature. This activity helps increase one's **breadth** of knowledge. In working through these papers, we inevitably end up studying a small number more deeply, which includes scanning and reading the literature cited by that paper. This activity helps increase one's **depth** of knowledge and supplements the project specific-reading we do in preparing for qualifying exams, writing fellowships/grants, and planning projects. Both breadth and depth of understanding are essential.

    Every other week at group meetings, we have a mini journal club where each lab member shares a 30-60 second summary of an interesting paper they have read. Periodically, we do journal clubs (Review Revue!) to have an in-depth conversation about papers and methods of particular interest. Often we invite other labs to join us for the discussion. We summarize the discussion and post a public [review](/reviews){:target="_blank" rel="noopener"}.

- title: Lab Notebooks and Data Deposition
  id: "data"
  show: False
  body: |
    As transparency, openness, and reproducibility are key values to the lab, sharing our information within the lab and externally to the scientific community is a top priority.

    ### Lab Notebooks

    Transparency and reproducibility start with thorough documentation of your work. All lab members are expected to record all of their work in a lab notebook. The primary guiding principle in keeping a lab notebook is that someone who is not familiar with your research should be able to recreate your work solely using the information you record in your notebook. Remember: Your notebook isn’t just for you! Additionally, when we work together to troubleshoot experiments, a good, detailed lab notebook is essential. Although extensive notetaking may slow you down in the short term, it will definitely accelerate things in the long term.

    Our lab primarily uses the electronic notebook [Benchling](https://benchling.com/){:target="_blank" rel="noopener"} for recordkeeping, which allows us to share protocols and makes our work visible to all other lab members. A physical lab notebook is also allowed, but it must stay in the lab after you leave. Further, our lab has recently adopted an in-house LIMs system to track protein expression, purification, crystallization, and data collection. Everyone can decide for themselves how to balance using Benchling, a physical lab notebook, and LIMs depending on their personal preference and the demands of their specific projects.

    Our lab’s guide to using Benchling can be found [here](https://docs.google.com/document/d/1ZsR7628PD5LOKuCUP11SHvOxUqh8PJQQ7SJvhFEXLlo/edit?usp=sharing){:target="_blank" rel="noopener"}, and our guide on how to craft good notebook entries is [here](https://docs.google.com/document/d/10yrbA3tFgIFE7paOR6v2qmdy3AVGY2wNwkvW7B4HFPo/edit?usp=sharing){:target="_blank" rel="noopener"}. UCSF has also published a [guide](https://compliance.ucsf.edu/sites/g/files/tkssra1886/f/wysiwyg/UCSFLabNotebookGuidance20210610.pdf){:target="_blank" rel="noopener"} for record keeping. These guides should be read thoroughly before starting your lab notebook.

    Main highlights:

    1.  Write your notebook so your work can be recreated solely from the information you record. Be very detailed.
        * Log plasmid maps, strains, oligos, storage locations, catalog numbers and batch numbers of kits, reagents, antibodies, peptides, enzymes, plates, etc.
        * Include calculations, times, temperatures, etc.
        * Screenshots or text of parameters used to run software
    2. Use a naming convention to make finding your notes easier for yourself and others.
        * For projects: Initials_YearProjectStarted_ProjectName.
        * For subfolders and notes within, take advantage of alphabetical sorting with a numbering scheme. (see images below as an example)
            - Project Folder > Subfolder 1 > notebooks titled: 000, 001, 002, 003, etc. makes referencing old notes easy and makes linearity clear
            - Project Folder > A-01 > notebooks titled 01.0.0-A, 01.1.0-A, 01.2.0-A, etc. A nice thing about this is that you can see the title of the note in the ‘tabs’ and know exactly which folder to look for it in. For example, 02.3.0-B is a notebook entry found in folder B-02.
            - Use minimal nested folders within a project. Project > subfolder 1 > subfolder 2 is the furthest down it should go.
            - Currently, there’s no way to “peak” to see a folder’s contents without opening the folder.
    3. Date everything. Date notebook entries and physical samples. This makes it much easier for you and others to retrace your steps. Plus, it makes using the calendar in Benchling easy to track items and work. (Must use “insert > new day” or “ctrl + \” for the Benchling calendar to work.)
    4. Input all handwritten notes. Either type it out or attach a photo.
    5. Record mistakes and things that don’t work.
    6. Include data, both raw and analyzed.
    7. Protocols should include: title, what the experiment sets out to achieve, materials needed with CAT numbers, procedure.
        * Copy a protocol to make changes and append a version number (v1, v2, etc.)
        * Add in the protocol’s intro what was changed and why
        * Lab protocols are in the top folder _Fraser Lab. If you create a new protocol that will be useful to anyone else in the lab, add a copy to the folder.

    ### Data Deposition

    We make our data, materials, and processing details available to the public through deposition to various repositories. Lab code is made accessible through [GitHub](https://github.com/fraser-lab){:target="_blank" rel="noopener"}. Data and information should be regularly deposited to the appropriate repositories. We happily share our plasmids and other materials freely by request.

    ### List of <a id="repositories">repositories</a>

    * **Addgene** - [Plasmids](https://www.addgene.org/c9d87dff_2638_427c_9b9f_f189bdd8f4bc/){:target="_blank" rel="noopener"}
    * **Zenodo** - [Datasets](https://zenodo.org/){:target="_blank" rel="noopener"}
    * **Protein Diffraction** - [X-Ray diffraction images](https://proteindiffraction.org/){:target="_blank" rel="noopener"}
    * **PDB** - [Protein structures](https://www.rcsb.org/search?request=%7B%22query%22%3A%7B%22parameters%22%3A%7B%22value%22%3A%22Fraser%2C%20J.S.%22%7D%2C%22type%22%3A%22terminal%22%2C%22service%22%3A%22text%22%2C%22node_id%22%3A0%7D%2C%22return_type%22%3A%22entry%22%2C%22request_options%22%3A%7B%22pager%22%3A%7B%22start%22%3A0%2C%22rows%22%3A25%7D%2C%22scoring_strategy%22%3A%22combined%22%2C%22sort%22%3A%5B%7B%22sort_by%22%3A%22score%22%2C%22direction%22%3A%22desc%22%7D%5D%7D%2C%22request_info%22%3A%7B%22src%22%3A%22ui%22%2C%22query_id%22%3A%22e69d1126f738b570a0ad272572a43a1c%22%7D%7D){:target="_blank" rel="noopener"}
    * **GenBank** - [Raw sequencing data](https://www.ncbi.nlm.nih.gov/genbank/submit/){:target="_blank" rel="noopener"}
    * **MaveDB** - [Deep mutational scanning (DMS) data](https://www.mavedb.org/){:target="_blank" rel="noopener"}
    * **Mave Registry** - [DMS experiments](https://registry.varianteffect.org/){:target="_blank" rel="noopener"}

- title: LLM + AI Usage
  id: "llm"
  show: False
  body: |
    Writing is one of the key ways to test your understanding. So we recommend using AI sparingly during scientific writing, especially during training exercises in graduate school (e.g. qualifying exams, fellowship drafts, etc). That said, we are also using LLMs extensively in coding, in summarizing work, and to give feedback.

    We also take a human-centered approach to writing and reading. The point of doing scientific writing is not only to help other people understand your work, but also to improve your own understanding. The point of doing peer review isn’t just to give feedback, it is also to develop a familiarity with cutting edge work and rapport within the community.

    LLMs can be useful tools for suggesting solutions also, but it remains important to stay vigilant and think critically. You always own whatever you do.

- title: Conflicts of Interest
  id: "coi"
  show: False
  body: |
    We occasionally also do sponsored research in the lab and I consult for companies to the extent my primary responsibilities allow. These activities can create potential financial [conflicts of interest](/coi). I’m as transparent as possible about this work and relationships while honoring confidentiality agreements. If these financial conflicts cause an issue with the work or working relationship between me and a lab member, I want people to feel like they can have those conversations with me early, and I am happy to talk about it. My department chair would be a good person to talk to if you don't feel comfortable talking to me about it directly.

